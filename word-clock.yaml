substitutions:
  name: "word-clock"
  friendly_name: "Word Clock"
  project_name: "Skyex Technologies.Word Clock"
  project_version: "1.9.0"
  # Firmware update manifests (ESPHome manifest JSON with the OTA binary and
  # its MD5), published with each release of SkyexTechnologies/
  # word-clock-firmware. Every clock has this address built in: never rename
  # that account or repository, GitHub Pages doesn't redirect.
  update_manifest_base: "https://skyextechnologies.github.io/word-clock-firmware/firmware/"
  # Compatibility line. A clock reads word-clock-<line>-hw<hardware
  # revision>.manifest.json (word-clock-<line>.manifest.json without a
  # layout), so a release can be kept from older lines or hardware revisions
  # (update-manifests.json). Raise it with a release older clocks must not
  # install.
  update_line: "1"
  # Lowest brightness (0-1), for automatic and manual brightness alike. Below
  # about 20 % the LEDs' 8-bit channels (after gamma correction) round the
  # weaker colour channels to 0, so mixed colours shift (orange turns red).
  brightness_floor: "0.2"

esphome:
  name: "${name}"
  name_add_mac_suffix: true
  # Release builds use the latest ESPHome; local builds use the pin in
  # requirements.txt. Keep this in sync with that pin.
  min_version: 2026.9.1
  platformio_options:
    build_flags:
      # 48 KB IRAM with the unused part as a second heap (16 KB instead of
      # 32 KB flash cache). The ESP8266 core puts the 16 KB TLS receive buffer
      # there (see http_request:), so HTTPS updates don't exhaust the main heap.
      - -DPIO_FRAMEWORK_ARDUINO_MMU_CACHE16_IRAM48_SECHEAP_SHARED
  project:
    name: "${project_name}"
    version: "${project_version}"
  on_boot:
    # After the layout component (setup priority 600) has loaded the factory
    # data, before Wi-Fi (250): hide the switches of indications this clock
    # doesn't have, and the automatic brightness settings without a light
    # sensor. ESPHome only allows this once per boot, before Home
    # Assistant and the web page list the entities.
    - priority: 500
      then:
        - lambda: |-
            using namespace esphome::wordclock_layout;
            id(indication_it_is)->set_internal(!id(layout).has_feature(FEATURE_IT_IS));
            id(indication_minutes)->set_internal(!id(layout).has_feature(FEATURE_MINUTES));
            id(indication_week_days)->set_internal(!id(layout).has_feature(FEATURE_WEEKDAYS));
            id(indication_special_days)->set_internal(id(layout).special_count() == 0);
            if (!id(layout).has_light_sensor()) {
              id(automatic_brightness)->set_internal(true);
              id(minimum_brightness)->set_internal(true);
              id(maximum_brightness)->set_internal(true);
              // A0 is unconnected: don't read random values.
              id(light_sensor)->stop_poller();
            }
            // The update manifest for this clock's hardware revision. The
            // first update check runs at least 10 s after setup.
            if (id(layout).is_provisioned())
              id(firmware_update)->set_source_url(
                  str_sprintf("${update_manifest_base}word-clock-${update_line}-hw%u.manifest.json",
                              id(layout).hardware_revision()));
    - priority: -10
      then:
        # Turn on with the Clock effect in one call: the effect is dropped while
        # the light restores switched off, and turning on without it first shows
        # all LEDs in the light's colour. (ESPHome allows no transition
        # together with an effect: it comes on at once.)
        - light.turn_on:
            id: word_clock
            effect: Clock
        # Brightness settings saved before the floor existed may be below it.
        - lambda: |-
            const float floor_b = ${brightness_floor};
            if (id(minimum_brightness).state < floor_b)
              id(minimum_brightness).make_call().set_value(floor_b).perform();
            if (id(maximum_brightness).state < floor_b)
              id(maximum_brightness).make_call().set_value(floor_b).perform();
        # Without a layout this sets full brightness for the colour test.
        - script.execute:
            id: set_light_brightness
            quick_transition: true
        - script.execute:
            id: apply_timezone
            timezone_index: !lambda return id(timezone).active_index().value_or(0);

external_components:
  # Next to this file, here and in the published release repository.
  - source:
      type: local
      path: components
    components: [wordclock_layout]

wordclock_layout:
  id: layout

esp8266:
  # ESP-12S modules have 4 MB of flash. The linker script supplied by
  # components/wordclock_layout replaces the 4 MB flash map: layout sector 1018
  # and ESPHome preferences sector 1019, with about 3 MB for OTA staging.
  board: esp12e
  restore_from_flash: true

logger:
  logs:
    # Both log the Wi-Fi password in plain text when it is set (captive portal
    # at INFO, Improv serial at DEBUG); keep those lines out of the logs.
    captive_portal: WARN
    improv_serial: INFO
    # "<component> took a long time for an operation": shown each time the web
    # page opens (the web server sends every entity at once, about 1 s on the
    # ESP8266). Harmless; errors from this tag still show.
    component: ERROR
    # "Window expired; cycle power to reopen window" after 15 minutes on every
    # clock without Home Assistant; on_timeout logs it as information below.
    provisioning: ERROR

api:
  # Every clock ships without a key. Home Assistant sets a per-clock key when
  # it adopts the clock; from then on only encrypted connections work, and
  # the key also protects OTA updates (see ota:). Without Home Assistant the
  # clock stays keyless. Only a factory reset (hold the button 10-20 s)
  # removes the key.
  encryption: {}
  services:
    - service: set_word_layout
      variables:
        flat_layout: int[]
        hardware_revision: int
        has_it_is: bool
        has_minutes: bool
        has_weekdays: bool
        next_hour_mask: int
        # Design version (0 = not set); hardware_revision 0 keeps the clock's own.
        layout_revision: int
      then:
        - lambda: |-
            if (!id(layout).write_layout(flat_layout, hardware_revision, has_it_is, has_minutes,
                                         has_weekdays, next_hour_mask, layout_revision)) {
              ESP_LOGE("word_clock", "Failed to save word layout to EEPROM");
            }
    # Special words: up to 4 hidden words, each lit on up to 4 dates a year.
    # special_leds: 4 x 24 LED indices (-1 = unused); special_dates: 4 x 4
    # dates as month * 100 + day (0 = unused). Keeps the rest of the layout.
    - service: set_special_words
      variables:
        special_leds: int[]
        special_dates: int[]
      then:
        - lambda: |-
            if (!id(layout).write_special(special_leds, special_dates)) {
              ESP_LOGE("word_clock", "Failed to save the special words");
            }

ota:
  # Native OTA (ESPHome Builder, `esphome run`), without a password (decided
  # 2026-10-09). Once Home Assistant has set the clock's API key, encryption
  # is offered, but ESPHome cannot require it for a key set at runtime, so
  # unencrypted uploads stay possible on the local network.
  - platform: esphome
  # Lets the clock download and install firmware itself (see update:).
  - platform: http_request

# A key can only be set within 15 minutes after power-on, so nobody on the
# network can claim a clock later. When the window closes, the setup hotspot
# also shuts down: unplug and replug the clock to set it up again.
provisioning:
  timeout: 15min
  on_timeout:
    - logger.log:
        level: INFO
        format: "Setup window closed; unplug the clock and plug it back in to connect Home Assistant"

http_request:
  # ESPHome cannot verify HTTPS certificates on the ESP8266; downloads are
  # checked against the MD5 in the manifest instead.
  verify_ssl: false
  # GitHub Pages ignores TLS max fragment length negotiation and sends records
  # up to 16 KB; with ESPHome's 512-byte default the manifest read fails
  # ("Stream pointer vanished"). Allocated only during a check or download.
  tls_buffer_size_rx: 16384

update:
  - platform: http_request
    id: firmware_update
    name: "Firmware"
    # Without a layout; on_boot picks the hardware revision's manifest.
    source: "${update_manifest_base}word-clock-${update_line}.manifest.json"
    # Checks every 6 hours (default); installing is always a user action.

wifi:
  fast_connect: False
  ap: {}

captive_portal:

improv_serial:

web_server:
  port: 80
  local: True
  # Version 3 has a colour picker for the light, so the colour can be set
  # without Home Assistant.
  version: 3
  # No firmware upload through the web page: anyone on the network could
  # install their own firmware. Updates come from update: (buttons below).
  ota: false

time:
  # Home Assistant supplies both current time and its configured timezone over
  # the native API. With no explicit timezone here, HA's timezone is applied
  # dynamically when this source syncs. Until then, apply_timezone sets
  # Amsterdam (option 0 of 03. Time Zone).
  - platform: homeassistant
    id: homeassistant_time
    on_time_sync:
      then:
        # A manually selected zone takes precedence over HA's automatic zone.
        # Delay until the API handler has applied the timezone from HA.
        - if:
            condition:
              lambda: return id(timezone).active_index().value_or(0) > 0;
            then:
              - delay: 1s
              - script.execute:
                  id: apply_timezone
                  timezone_index: !lambda return id(timezone).active_index().value_or(0);
  - platform: sntp
    id: sntp_time

button:
  # The web page has no install button for update entities, so these two
  # buttons and the "Firmware Update" text sensor expose the update there.
  - platform: template
    name: "Check for Firmware Update"
    icon: "mdi:refresh"
    entity_category: config
    on_press:
      - update.check: firmware_update
  - platform: template
    name: "Install Firmware Update"
    icon: "mdi:download"
    entity_category: config
    on_press:
      - if:
          condition:
            lambda: return id(firmware_update)->state == update::UPDATE_STATE_AVAILABLE;
          then:
            - update.perform: firmware_update
          else:
            - logger.log:
                level: WARN
                format: "No firmware update available to install"
  # Internal: a factory reset needs physical access (hold the button
  # 10-20 s), so nobody on the network can wipe the clock.
  - platform: factory_reset
    id: factory_reset_button
    name: Factory Reset Word Clock
    internal: true
  - platform: restart
    id: restart_button
    name: Restart Word Clock

binary_sensor:
  - platform: gpio
    id: reset_button
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: True
    internal: true
    on_click:
      - min_length: 2s
        max_length: 5s
        then:
          - button.press: restart_button
      - min_length: 10s
        max_length: 20s
        then:
          - button.press: factory_reset_button
  # Off means the word layout in flash sector 1018 is missing or corrupt, so
  # the clock runs its LED self-test until it is provisioned (see README).
  - platform: template
    id: layout_provisioned
    name: "Layout Provisioned"
    entity_category: diagnostic
    icon: "mdi:grid"
    lambda: return id(layout).is_provisioned();

select:
  # How the words change every five minutes, over 02. Transition Time.
  - platform: template
    name: "02. Transition Effect"
    id: transition_effect
    restore_value: True
    optimistic: True
    options:
      - "Fade"
      - "Crossfade"
      - "Typewriter"
      - "Sweep"
    initial_option: "Fade"
    icon: "mdi:transition-masked"
  - platform: template
    name: "03. Time Zone"
    id: timezone
    restore_value: True
    optimistic: True
    icon: "mdi:map-clock"
    # The selection is saved and applied by option index (see the switch in
    # the apply_timezone script). Only append new zones at the end, and update
    # apply_timezone to match; never insert, remove or reorder options, or
    # a clock's saved time zone changes after an update.
    options:
      - "Home Assistant (otherwise Amsterdam)"
      - "UTC (UTC+00:00)"
      - "Amsterdam (UTC+01:00 / UTC+02:00 DST)"
      - "London (UTC+00:00 / UTC+01:00 DST)"
      - "New York (UTC-05:00 / UTC-04:00 DST)"
      - "Chicago (UTC-06:00 / UTC-05:00 DST)"
      - "Denver (UTC-07:00 / UTC-06:00 DST)"
      - "Los Angeles (UTC-08:00 / UTC-07:00 DST)"
      - "Seoul / Tokyo (UTC+09:00)"
      - "Sydney (UTC+10:00 / UTC+11:00 DST)"
      - "Istanbul (UTC+03:00)"
      - "Beijing / Taipei (UTC+08:00)"
      - "São Paulo (UTC-03:00)"
      - "Mexico City (UTC-06:00)"
    initial_option: "Home Assistant (otherwise Amsterdam)"
    on_value:
      then:
        - script.execute:
            id: apply_timezone
            timezone_index: !lambda return id(timezone).active_index().value_or(0);

switch:
  - platform: template
    name: "04. Automatic Brightness"
    id: automatic_brightness
    optimistic: True
    restore_mode: RESTORE_DEFAULT_ON
    icon: "mdi:brightness-auto"
  - platform: template
    name: "Indication: It is"
    id: indication_it_is
    optimistic: True
    restore_mode: RESTORE_DEFAULT_ON
    icon: "mdi:file-word-box-outline"
  - platform: template
    name: "Indication: Minutes"
    id: indication_minutes
    optimistic: True
    restore_mode: RESTORE_DEFAULT_ON
    icon: "mdi:file-word-box-outline"
  - platform: template
    name: "Indication: Week Days"
    id: indication_week_days
    optimistic: True
    restore_mode: RESTORE_DEFAULT_ON
    icon: "mdi:file-word-box-outline"
  # Special words on their dates (hidden when the layout has none).
  - platform: template
    name: "Indication: Special Days"
    id: indication_special_days
    optimistic: True
    restore_mode: RESTORE_DEFAULT_ON
    icon: "mdi:cake-variant-outline"

script:
  - id: apply_timezone
    parameters:
      timezone_index: int
    then:
      - lambda: |-
          // Upper bound = last option index; raise it when appending a zone.
          if (timezone_index < 0 || timezone_index > 13) return;

          esphome::time::ParsedTimezone tz{};
          auto set_dst_rule = [](esphome::time::DSTRule &rule, uint8_t month,
                                 uint8_t week, int32_t time_seconds) {
            rule.type = esphome::time::DSTRuleType::MONTH_WEEK_DAY;
            rule.month = month;
            rule.week = week;
            rule.day_of_week = 0;  // Sunday
            rule.time_seconds = time_seconds;
          };

          switch (timezone_index) {
            case 1:  // UTC
              break;
            // Option 0 follows Home Assistant. Until Home Assistant sends its
            // zone, and on clocks without it, use Amsterdam, not the zone of
            // the build machine (UTC for release builds).
            case 0:
            case 2:  // Europe/Amsterdam
              tz.std_offset_seconds = -3600;
              tz.dst_offset_seconds = -7200;
              set_dst_rule(tz.dst_start, 3, 5, 7200);
              set_dst_rule(tz.dst_end, 10, 5, 10800);
              break;
            case 3:  // Europe/London
              tz.dst_offset_seconds = -3600;
              set_dst_rule(tz.dst_start, 3, 5, 3600);
              set_dst_rule(tz.dst_end, 10, 5, 7200);
              break;
            case 4:  // America/New_York
              tz.std_offset_seconds = 18000;
              tz.dst_offset_seconds = 14400;
              set_dst_rule(tz.dst_start, 3, 2, 7200);
              set_dst_rule(tz.dst_end, 11, 1, 7200);
              break;
            case 5:  // America/Chicago
              tz.std_offset_seconds = 21600;
              tz.dst_offset_seconds = 18000;
              set_dst_rule(tz.dst_start, 3, 2, 7200);
              set_dst_rule(tz.dst_end, 11, 1, 7200);
              break;
            case 6:  // America/Denver
              tz.std_offset_seconds = 25200;
              tz.dst_offset_seconds = 21600;
              set_dst_rule(tz.dst_start, 3, 2, 7200);
              set_dst_rule(tz.dst_end, 11, 1, 7200);
              break;
            case 7:  // America/Los_Angeles
              tz.std_offset_seconds = 28800;
              tz.dst_offset_seconds = 25200;
              set_dst_rule(tz.dst_start, 3, 2, 7200);
              set_dst_rule(tz.dst_end, 11, 1, 7200);
              break;
            case 8:  // Asia/Seoul, Asia/Tokyo (no DST)
              tz.std_offset_seconds = -32400;
              break;
            case 9:  // Australia/Sydney
              tz.std_offset_seconds = -36000;
              tz.dst_offset_seconds = -39600;
              set_dst_rule(tz.dst_start, 10, 1, 7200);
              set_dst_rule(tz.dst_end, 4, 1, 10800);
              break;
            // No daylight saving time in any of these (Turkey since 2016,
            // Brazil since 2019, Mexico since 2022).
            case 10:  // Europe/Istanbul
              tz.std_offset_seconds = -10800;
              break;
            case 11:  // Asia/Shanghai, Asia/Taipei, Asia/Hong_Kong
              tz.std_offset_seconds = -28800;
              break;
            case 12:  // America/Sao_Paulo
              tz.std_offset_seconds = 10800;
              break;
            case 13:  // America/Mexico_City
              tz.std_offset_seconds = 21600;
              break;
          }

          esphome::time::set_global_tz(tz);

          if (timezone_index == 0) {
            // When Home Assistant is connected, ask it for the time now: its
            // reply also sets its zone, instead of keeping Amsterdam until
            // the next periodic sync. Does nothing without Home Assistant.
            id(homeassistant_time).update();
          }

  - id: set_light_brightness
    parameters:
      quick_transition: bool
    then:
      - if:
          condition:
            light.is_on: word_clock
          then:
            - lambda: |-
                float brightness;
                if (!id(layout).is_provisioned()) {
                  // No layout: the colour test runs at full brightness, whatever
                  // the sensor or the 04. Automatic Brightness switch says.
                  brightness = 1.0f;
                } else if (!id(layout).has_light_sensor() || !id(automatic_brightness).state ||
                           std::isnan(id(light_sensor).state)) {
                  // No light sensor fitted, manual brightness, or no sensor
                  // reading yet (up to 15 s after boot, while the brightness
                  // numbers already call this script when they restore):
                  // leave the brightness alone.
                  return;
                } else {
                  const float floor_b = ${brightness_floor};
                  float min_brightness = std::max(id(minimum_brightness).state, floor_b);
                  float max_brightness = std::max(id(maximum_brightness).state, min_brightness);
                  brightness = (max_brightness - min_brightness) * id(light_sensor).state + min_brightness;
                }
                // Not saved: the sensor adjusts brightness every 15 s, and
                // saving each change would wear out the settings flash sector.
                // Only changes made by the user are restored after a reboot.
                id(word_clock).make_call()
                    .set_brightness(clamp(brightness, (float) ${brightness_floor}, 1.0f))
                    .set_transition_length(quick_transition ? 500 : 10000)
                    .set_save(false)
                    .perform();

number:
  - platform: template
    name: "02. Transition Time"
    id: transition
    optimistic: True
    min_value: 0
    max_value: 10
    step: 1
    restore_value: True
    icon: "mdi:transition"
  - platform: template
    name: "05. Minimum Brightness"
    id: minimum_brightness
    optimistic: True
    min_value: ${brightness_floor}
    max_value: 1
    step: 0.01
    restore_value: True
    icon: "mdi:brightness-4"
    on_value:
      - if: 
          condition:
            - lambda: "return id(maximum_brightness).state < x;"
          then:
            - number.set:
               id: maximum_brightness
               value: !lambda "return x;"
      - script.execute: 
          id: set_light_brightness
          quick_transition: True
  - platform: template
    name: "06. Maximum Brightness"
    id: maximum_brightness
    optimistic: True
    min_value: ${brightness_floor}
    max_value: 1
    initial_value: 1
    step: 0.01
    restore_value: True  
    icon: "mdi:brightness-5"
    on_value:
      - if: 
          condition:
            - lambda: "return x < id(minimum_brightness).state;"
          then:
            - number.set:
               id: minimum_brightness
               value: !lambda "return x;"
      - script.execute: 
          id: set_light_brightness
          quick_transition: True
text_sensor:
  # Factory data from the layout sector: hardware revision and fitted
  # indications, plus "no light sensor" when none is fitted. Written with the
  # layout (scripts/provision_layout*.py).
  - platform: template
    name: "Hardware"
    icon: "mdi:chip"
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      using namespace esphome::wordclock_layout;
      if (!id(layout).is_provisioned())
        return std::string("Not provisioned");
      std::string fitted;
      if (id(layout).has_feature(FEATURE_IT_IS)) fitted += "it is, ";
      if (id(layout).has_feature(FEATURE_MINUTES)) fitted += "minutes, ";
      if (id(layout).has_feature(FEATURE_WEEKDAYS)) fitted += "weekdays, ";
      fitted = fitted.empty() ? std::string("none") : fitted.substr(0, fitted.size() - 2);
      std::string layout_rev = id(layout).layout_revision()
          ? ", layout " + std::to_string(id(layout).layout_revision()) : std::string("");
      std::string sensor = id(layout).has_light_sensor() ? std::string("") : std::string(", no light sensor");
      if (id(layout).special_count())
        sensor += ", " + std::to_string(id(layout).special_count()) + " special word" +
                  (id(layout).special_count() > 1 ? "s" : "");
      return "Revision " + std::to_string(id(layout).hardware_revision()) + layout_rev + " (indications: " + fitted +
             ")" + sensor;
  - platform: template
    name: "Firmware Update"
    icon: "mdi:update"
    entity_category: diagnostic
    update_interval: 30s
    lambda: |-
      auto *fw = id(firmware_update);
      switch (fw->state) {
        case update::UPDATE_STATE_AVAILABLE:
          return std::string("${project_version} -> ") + fw->update_info.latest_version + " available";
        case update::UPDATE_STATE_INSTALLING:
          return std::string("Installing...");
        case update::UPDATE_STATE_NO_UPDATE:
          return std::string("${project_version} (up to date)");
        default:
          return std::string("${project_version} (update server not reachable)");
      }

sensor:
  - platform: adc
    pin: A0
    name: "Light Sensor"
    id: light_sensor
    update_interval: 15s
    internal: True
    on_value:
      - script.execute: 
          id: set_light_brightness
          quick_transition: False

light:
  - platform: neopixelbus
    type: GRB
    variant: WS2812X
    pin: GPIO2
    num_leds: 121
    name: "01. Word Clock"
    id: word_clock
    # Changes made by hand (brightness, colour, on) apply at once. Automatic
    # brightness sets its own fades (set_light_brightness).
    default_transition_length: 0s
    icon: "mdi:file-word-box-outline"
    # The light saves its own colour, brightness and effect; automatic
    # brightness is not saved (see set_light_brightness). RESTORE_AND_OFF keeps
    # it off during setup: the light is set up before the layout component and
    # Wi-Fi, and is switched on in on_boot instead.
    restore_mode: RESTORE_AND_OFF
    on_state:
      then:
        - if:
            # Use the requested state (remote_values): when the light is
            # switched on from the web page or Home Assistant, it is still
            # fading in, and light.is_on (current_values) reads off, so the
            # effect was never set and all LEDs lit up.
            condition:
              lambda: |-
                return id(word_clock).remote_values.is_on() &&
                       id(word_clock).get_effect_name() == "None";
            then:
              - delay: 10ms
              # Enforce the light effect to be at "Clock"
              - light.control:
                  id: word_clock
                  effect: Clock
        # Never below the brightness floor, also when the brightness is set by
        # hand on the web page or in Home Assistant.
        - if:
            condition:
              lambda: |-
                return id(word_clock).remote_values.is_on() &&
                       id(word_clock).remote_values.get_brightness() < ${brightness_floor} - 0.001f;
            then:
              - delay: 10ms
              - light.control:
                  id: word_clock
                  brightness: ${brightness_floor}
                  transition_length: 500ms
        # Switch off at once, also when the request asks for a fade (for
        # example a transition sent by Home Assistant). on_turn_off only fires
        # after the fade has finished, so react to the requested state here.
        - if:
            condition:
              lambda: |-
                return !id(word_clock).remote_values.is_on() &&
                       id(word_clock).current_values.is_on();
            then:
              - delay: 10ms
              - light.turn_off:
                  id: word_clock
                  transition_length: 0s
    effects:
      - addressable_lambda:
          name: "Clock"
          update_interval: 20ms
          lambda: |-
            static int minutes;
            static int hours;
            static int CurrentTime[5];
            static int PreviousTime[5];
            // The letters of the current time, and of the time before the
            // last change (what the transition starts from).
            static Color letters[121];
            static Color previous[121];
            // Transition progress in 20 ms ticks; steps == 0: none running.
            static int step = 0;
            static int steps = 0;

            if (initial_run) {
              it.all() = Color::BLACK;
              std::fill_n(letters, it.size(), Color::BLACK);
              std::fill_n(previous, it.size(), Color::BLACK);
              steps = 0;
            }

            /*
             * Setup states, shown instead of the time:
             * - No valid word layout: all LEDs cycle red, green, blue (1 s each)
             *   at full brightness (set_light_brightness forces 100%), so every
             *   LED and colour channel can be checked before provisioning. White
             *   is skipped: all LEDs at full white draw about 7 A.
             * - No time yet since power-on (no Wi-Fi, Home Assistant or NTP):
             *   one LED at a time steps through all LEDs (100 ms each) in the
             *   light's colour. Its index is logged at VERBOSE level, which helps
             *   when mapping a new letter grid. Once the time is known, a later
             *   Wi-Fi drop doesn't bring this back: the clock keeps its time.
             */
            if (!id(layout).is_provisioned()) {
              static const uint32_t COLOUR_MS = 1000;
              const Color colours[3] = {Color(255, 0, 0), Color(0, 255, 0), Color(0, 0, 255)};
              it.all() = colours[(millis() / COLOUR_MS) % 3];
              return;
            }

            auto time = id(sntp_time).now();
            if (!time.is_valid()) {
              static const uint32_t CHASE_MS = 100;
              static int last_led = -1;
              const int led = (millis() / CHASE_MS) % it.size();
              it.all() = Color::BLACK;
              it[led] = current_color;
              if (led != last_led) {
                ESP_LOGV("led_test", "LED %d", led);
                last_led = led;
              }
              return;
            }

            int total_minutes = time.hour * 60 + time.minute;
            minutes = (int)(total_minutes / 5) * 5 % 60; // minutes per 5
            hours = total_minutes / 60;

            // The layout says per minute phrase whether it names the next
            // hour (Dutch from :20, English from :35, Korean never).
            const uint8_t phrase = minutes / 5;
            if (id(layout).refers_to_next_hour(phrase)) hours += 1;

            CurrentTime[0] = 0;
            CurrentTime[1] = phrase + wordclock_layout::ROW_MINUTES;
            CurrentTime[2] = id(layout).hour_row(hours, phrase);
            CurrentTime[3] = time.day_of_week + 24;
            CurrentTime[4] = (total_minutes % 5) + 32;

            // When the five-minute phrase changes, the transition starts from
            // the letters shown until now. Minute dots and the weekday change
            // at once.
            if (!initial_run && PreviousTime[1] != CurrentTime[1]) {
              std::copy_n(letters, it.size(), previous);
              step = 0;
              // 02. Transition Time in seconds, 50 ticks of 20 ms each.
              steps = int(50 * id(transition).state);
            }
            for (int i = 0; i < 5; i++) PreviousTime[i] = CurrentTime[i];

            std::fill_n(letters, it.size(), Color::BLACK);
            for (int i = 0; i < 5; i++) {
              // Skip indications that are switched off or not fitted on this clock.
              if (i == 0 && (!id(indication_it_is).state ||
                             !id(layout).has_feature(wordclock_layout::FEATURE_IT_IS))) continue;
              if (i == 3 && (!id(indication_week_days).state ||
                             !id(layout).has_feature(wordclock_layout::FEATURE_WEEKDAYS))) continue;
              if (i == 4 && (!id(indication_minutes).state ||
                             !id(layout).has_feature(wordclock_layout::FEATURE_MINUTES))) continue;
              for (int j = 0; j < wordclock_layout::MAX_LEDS_PER_WORD; j++) {
                int8_t led = id(layout).led_for(CurrentTime[i], j);
                if (led >= 0) letters[led] = current_color;
              }
            }

            // Special words on their dates, with a slow pulse (60-100 %,
            // every 4 s); letters that are also part of the time stay full.
            // Off with the "Indication: Special Days" switch. The dip never
            // takes the LEDs below the brightness floor, where the 8-bit
            // channels round to 0: near minimum brightness it gets shallower,
            // at the minimum the word stays lit.
            const float brightness = id(word_clock).current_values.get_brightness();
            const float lowest = brightness > 0 ? std::min(1.0f, std::max(0.6f, float(${brightness_floor}) / brightness)) : 1.0f;
            const float pulse = lowest + (1.0f - lowest) * (0.5f + 0.5f * sinf(millis() * (2.0f * float(M_PI) / 4000.0f)));
            for (uint8_t s = 0; id(indication_special_days).state && s < wordclock_layout::MAX_SPECIAL_WORDS; s++) {
              if (!id(layout).special_on(s, time.month, time.day_of_month)) continue;
              for (int j = 0; j < wordclock_layout::MAX_LEDS_PER_WORD; j++) {
                int8_t led = id(layout).special_led_for(s, j);
                if (led >= 0 && !(letters[led].r || letters[led].g || letters[led].b))
                  letters[led] = Color(uint8_t(current_color.r * pulse), uint8_t(current_color.g * pulse),
                                       uint8_t(current_color.b * pulse));
              }
            }

            if (steps <= 0 || step >= steps) {
              steps = 0;
              for (int i = 0; i < it.size(); i++) it[i] = letters[i];
              return;
            }

            /*
             * Transition from `previous` to `letters`, p from 0 to 1 over
             * 02. Transition Time, as 02. Transition Effect says:
             * - Fade: the old words fade out, then the new ones fade in.
             * - Crossfade: both at once; letters lit in both stay lit.
             * - Typewriter: the old letters disappear one by one from the end,
             *   then the new ones appear in reading order.
             * - Sweep: a soft edge moves from left to right, new behind it.
             * LEDs snake through the grid: LED i is in row i / 11, column
             * i % 11, mirrored on odd rows.
             */
            const float p = float(step) / steps;
            step++;
            auto blend = [](Color a, Color b, float t) {
              return Color(uint8_t(a.r + (b.r - a.r) * t), uint8_t(a.g + (b.g - a.g) * t),
                           uint8_t(a.b + (b.b - a.b) * t));
            };
            auto column = [](int i) { int r = i / 11, c = i % 11; return r % 2 == 0 ? c : 10 - c; };
            auto lit = [](const Color &c) { return c.r || c.g || c.b; };
            const auto effect = id(transition_effect).active_index().value_or(0);

            if (effect == 1) {
              // Crossfade
              for (int i = 0; i < it.size(); i++) it[i] = blend(previous[i], letters[i], p);
            } else if (effect == 3) {
              // Sweep: the edge runs from before column 0 to past column 10,
              // two columns wide.
              const float edge = p * 13.0f - 1.0f;
              for (int i = 0; i < it.size(); i++) {
                float t = (edge - column(i) + 1.0f) / 2.0f;
                it[i] = blend(previous[i], letters[i], t < 0 ? 0 : (t > 1 ? 1 : t));
              }
            } else if (effect == 2) {
              // Typewriter: first half keeps the first `count` old letters in
              // reading order, second half shows the first `count` new ones.
              const Color *source = p < 0.5f ? previous : letters;
              int total = 0;
              for (int i = 0; i < it.size(); i++) if (lit(source[i])) total++;
              const int count = p < 0.5f ? int(total * (1.0f - 2.0f * p) + 0.999f) : int(total * (2.0f * p - 1.0f));
              it.all() = Color::BLACK;
              int rank = 0;
              for (int r = 0; r < 11; r++) {
                for (int c = 0; c < 11; c++) {
                  int i = r * 11 + (r % 2 == 0 ? c : 10 - c);
                  if (i < it.size() && lit(source[i]) && rank++ < count) it[i] = source[i];
                }
              }
            } else {
              // Fade
              for (int i = 0; i < it.size(); i++) {
                it[i] = p < 0.5f ? blend(previous[i], Color::BLACK, 2.0f * p)
                                 : blend(Color::BLACK, letters[i], 2.0f * p - 1.0f);
              }
            }
