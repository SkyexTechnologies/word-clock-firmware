<!-- favicon.ico is linked by the theme; browsers that read SVG prefer this. -->
<link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}">
<script>
  // Follow the system's light or dark mode.
  (function () {
    var dark = window.matchMedia('(prefers-color-scheme: dark)');
    function apply() { jtd.setTheme(dark.matches ? 'skyex-dark' : 'default'); }
    if (dark.matches) { apply(); }
    dark.addEventListener('change', apply);
  })();
</script>
