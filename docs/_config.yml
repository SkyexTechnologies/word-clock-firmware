title: Word Clock
description: Documentation and firmware for the Skyex Technologies Word Clock.
theme: just-the-docs

url: https://skyextechnologies.github.io

# Light by default; dark when the visitor's system is in dark mode
# (_includes/head_custom.html).
color_scheme: skyex

search_enabled: true
search:
  heading_level: 2
  previews: 2
  preview_words_before: 3
  preview_words_after: 3
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

enable_copy_code_button: true
heading_anchors: true

aux_links:
  "View on GitHub":
    - "https://github.com/SkyexTechnologies/word-clock-firmware"
aux_links_new_tab: true

back_to_top: true
back_to_top_text: "Back to top"

footer_content: "© Skyex Technologies. Firmware licensed under the GNU GPL v3."

callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Warning
    color: yellow
  important:
    title: Important
    color: red

# The firmware/ folder is added by the Pages workflow from the latest release.
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
