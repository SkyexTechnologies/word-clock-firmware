# Builds the firmware for a release tag vX.Y.Z (pushed by the release workflow
# of the private development repository) and attaches it to a pre-release.
# The pre-release is only created once the firmware is built, so it can't be
# published without its files. Clocks don't see a pre-release; publishing it
# as a release makes it available to them (see pages.yml).

name: Build firmware

on:
  push:
    tags:
      - "v*"
  # Test build without a release.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Read release notes
    runs-on: ubuntu-latest
    outputs:
      summary: ${{ steps.notes.outputs.summary }}
      url: ${{ steps.notes.outputs.url }}
    steps:
      - name: Check out
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/checkout@v7
      - name: Read the tag message
        id: notes
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          echo "summary=$(git tag -l --format='%(contents:subject)' "$TAG")" >> "$GITHUB_OUTPUT"
          echo "url=https://github.com/${{ github.repository }}/releases/tag/$TAG" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: prepare
    uses: esphome/workflows/.github/workflows/build.yml@2026.9.0
    with:
      files: word-clock.yaml
      esphome-version: latest
      release-version: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
      release-summary: ${{ needs.prepare.outputs.summary }}
      release-url: ${{ needs.prepare.outputs.url }}

  # Draft first (visible only to maintainers), then the files, then a visible
  # pre-release: a release can never be published without its firmware.
  create-release:
    name: Create draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Create draft from the tag message
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          gh release create "$TAG" --verify-tag --draft --prerelease --notes-from-tag --title "$TAG"

  upload:
    name: Upload to release
    needs: create-release
    if: startsWith(github.ref, 'refs/tags/v')
    uses: esphome/workflows/.github/workflows/upload-to-gh-release.yml@2026.9.0
    with:
      version: ${{ github.ref_name }}
      draft: true

  publish-prerelease:
    name: Publish pre-release
    needs: upload
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Turn the draft into a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          id=$(gh api "repos/$GH_REPO/releases" --paginate \
            --jq '[.[] | select(.tag_name == $ENV.TAG and .draft)] | first | .id // empty')
          if [ -z "$id" ]; then
            echo "::error::No draft release for $TAG"
            exit 1
          fi
          gh api --method PATCH "repos/$GH_REPO/releases/$id" -F draft=false -F prerelease=true > /dev/null
          gh release view "$TAG" --json url,isPrerelease,assets --jq '{url, isPrerelease, files: (.assets | length)}'
