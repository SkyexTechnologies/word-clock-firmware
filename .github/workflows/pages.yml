# Publishes the documentation and the released firmware to GitHub Pages.
# Clocks check an update manifest in firmware/ there (word-clock-<line>-hw<n>
# .manifest.json; word-clock.manifest.json for firmware up to 1.5.0).
# update-manifests.json says which release each manifest offers: "latest"
# (the newest full release) or a fixed tag, so older clocks can be kept on a
# release that suits them. This runs when a release is published or a
# pre-release is marked as a release (through redispatch below), and when the
# documentation or update-manifests.json changes.

name: Publish docs and firmware

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "update-manifests.json"
      - ".github/workflows/pages.yml"
  release:
    types: [released]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # A release event runs on its tag, and the github-pages environment only
  # accepts deployments from main: start this workflow again on main.
  # (workflow_dispatch is one of the events GITHUB_TOKEN may trigger.)
  redispatch:
    name: Run on main
    if: github.event_name == 'release'
    runs-on: ubuntu-26.04
    permissions:
      actions: write
    steps:
      - name: Start this workflow on main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run pages.yml --ref main

  build:
    name: Build site
    if: github.event_name != 'release'
    runs-on: ubuntu-26.04
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # docs/Gemfile comes from site/ in the development repository, the same
      # file its local preview uses.
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: docs

      - name: Set up Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build the documentation
        run: BUNDLE_GEMFILE=docs/Gemfile bundle exec jekyll build --source docs --destination _site --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      # Each release goes to firmware/<tag>/; each manifest is that release's
      # word-clock.manifest.json with its file paths pointing there. Never
      # publish a manifest without its firmware.
      - name: Publish the update manifests
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Pre-releases are skipped: "latest" is the newest full release.
          latest=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name 2> /dev/null || true)
          if [ -z "$latest" ]; then
            echo "::warning::No released firmware yet; clocks will report the update server as unreachable."
            exit 0
          fi
          list=update-manifests.json
          if [ ! -f "$list" ]; then
            echo "::warning::No update-manifests.json; publishing only word-clock.manifest.json"
            list=$RUNNER_TEMP/update-manifests.json
            echo '{"manifests": {"word-clock.manifest.json": "latest"}}' > "$list"
          fi
          mkdir -p _site/firmware
          while read -r name tag; do
            [ "$tag" = latest ] && tag=$latest
            dir=_site/firmware/$tag
            [ -d "$dir" ] || gh release download "$tag" --dir "$dir"
            if [ ! -f "$dir/word-clock.manifest.json" ]; then
              echo "::error::Release $tag has no word-clock.manifest.json; not publishing"
              exit 1
            fi
            jq --arg d "$tag/" '.builds |= map(
                .ota.path = $d + .ota.path
                | if .parts then .parts |= map(.path = $d + .path) else . end)' \
              "$dir/word-clock.manifest.json" > "_site/firmware/$name"
            echo "$name: $tag"
          done < <(jq -r '.manifests | to_entries[] | "\(.key) \(.value)"' "$list")

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
